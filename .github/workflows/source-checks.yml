name: Source and LoRA workflow checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: configs/requirements-ci.txt
      - run: python -m pip install -r configs/requirements-ci.txt
      - name: Source and documentation checks
        run: python scripts/check_project.py
      - name: Published source hygiene
        run: python scripts/check_release.py --tracked
      - name: CPU LoRA workflow contracts
        run: python -m unittest discover -s tests -p 'test_lora*.py' -v
      - name: Publication checker contracts
        run: python -m unittest discover -s tests -p 'test_release_checks.py' -v
